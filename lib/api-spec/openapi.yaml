openapi: 3.1.0
info:
  title: Payroll Portal API
  version: "2.0"

servers:
  - url: /api

tags:
  - name: health
  - name: auth
  - name: company-settings
  - name: dashboard
  - name: audit-logs
  - name: storage
  - name: employees
  - name: payroll
  - name: payroll-runs

paths:
  # ─────────────────────────────────────────────
  # Health
  # ─────────────────────────────────────────────
  /healthz:
    get:
      operationId: getHealth
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─────────────────────────────────────────────
  # Auth
  # ─────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────
  # Company Settings
  # ─────────────────────────────────────────────
  /company-settings:
    get:
      operationId: getCompanySettings
      tags: [company-settings]
      summary: Get company settings
      responses:
        "200":
          description: Company settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateCompanySettings
      tags: [company-settings]
      summary: Update company settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanySettingsUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"

  /company-settings/logo:
    get:
      operationId: getCompanyLogo
      tags: [company-settings]
      summary: Download company logo (binary)
      responses:
        "200":
          description: Logo image
          content:
            image/*:
              schema:
                type: string
                format: binary
        "404":
          description: No logo configured
    delete:
      operationId: removeCompanyLogo
      tags: [company-settings]
      summary: Remove company logo
      responses:
        "200":
          description: Logo removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanySettings"

  # ─────────────────────────────────────────────
  # Dashboard
  # ─────────────────────────────────────────────
  /dashboard/stats:
    get:
      operationId: getDashboardStats
      tags: [dashboard]
      summary: Get dashboard statistics
      responses:
        "200":
          description: Dashboard stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardStats"

  # ─────────────────────────────────────────────
  # Audit Logs
  # ─────────────────────────────────────────────
  /audit-logs:
    get:
      operationId: getAuditLogs
      tags: [audit-logs]
      summary: List audit logs
      parameters:
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Audit logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditLog"

  # ─────────────────────────────────────────────
  # Storage
  # ─────────────────────────────────────────────
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL (images)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /storage/objects/{objectPath}:
    get:
      operationId: getStorageObject
      tags: [storage]
      summary: Download a stored object
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary

  # ─────────────────────────────────────────────
  # Employees
  # ─────────────────────────────────────────────
  /employees:
    get:
      operationId: listEmployees
      tags: [employees]
      summary: List employees
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: branch
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [ACTIVE, INACTIVE]
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: Employee list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmployeeListResponse"
    post:
      operationId: createEmployee
      tags: [employees]
      summary: Create employee
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "409":
          description: Duplicate employee code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /employees/{id}:
    get:
      operationId: getEmployee
      tags: [employees]
      summary: Get employee by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateEmployee
      tags: [employees]
      summary: Update employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeUpdate"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Duplicate employee code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /employees/{id}/status:
    patch:
      operationId: updateEmployeeStatus
      tags: [employees]
      summary: Activate or deactivate employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeStatusInput"
      responses:
        "200":
          description: Updated employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ─────────────────────────────────────────────
  # Payroll Upload Workflow
  # ─────────────────────────────────────────────
  /payroll/request-upload-url:
    post:
      operationId: requestPayrollUploadUrl
      tags: [payroll]
      summary: Request presigned URL for payroll Excel upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollUploadUrlRequest"
      responses:
        "200":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"

  /payroll/parse-excel:
    post:
      operationId: parsePayrollExcel
      tags: [payroll]
      summary: Parse uploaded Excel — returns sheet names and headers
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParseExcelInput"
      responses:
        "200":
          description: Parse result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParseExcelResult"

  /payroll/validate:
    post:
      operationId: validatePayroll
      tags: [payroll]
      summary: Validate mapped payroll data against employee master
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollValidationInput"
      responses:
        "200":
          description: Validation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollValidationResult"

  /payroll/import:
    post:
      operationId: importPayroll
      tags: [payroll]
      summary: Confirm and import payroll run
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayrollImportInput"
      responses:
        "201":
          description: Payroll run created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollImportResult"

  /payroll/column-mapping:
    get:
      operationId: getColumnMapping
      tags: [payroll]
      summary: Get last saved column mapping
      responses:
        "200":
          description: Saved mapping (or null if none)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnMappingResponse"
    put:
      operationId: saveColumnMapping
      tags: [payroll]
      summary: Save column mapping for future uploads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColumnMappingInput"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ColumnMappingResponse"

  # ─────────────────────────────────────────────
  # Payroll Runs (History)
  # ─────────────────────────────────────────────
  /payroll-runs:
    get:
      operationId: listPayrollRuns
      tags: [payroll-runs]
      summary: List all payroll runs
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: number
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: number
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Payroll runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunListResponse"

  /payroll-runs/{id}:
    get:
      operationId: getPayrollRun
      tags: [payroll-runs]
      summary: Get payroll run with records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Payroll run detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRunDetail"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /payroll-runs/{id}/payslip-statuses:
    get:
      operationId: getPayslipStatuses
      tags: [payroll-runs]
      summary: Get payslip generation statuses for a run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Statuses
          content:
            application/json:
              schema:
                type: object
                required: [statuses]
                properties:
                  statuses:
                    type: array
                    items:
                      $ref: "#/components/schemas/PayslipStatus"
    patch:
      operationId: savePayslipStatuses
      tags: [payroll-runs]
      summary: Bulk-upsert payslip generation statuses
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayslipStatusBatchUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: number

  /payroll-runs/{id}/cancel:
    patch:
      operationId: cancelPayrollRun
      tags: [payroll-runs]
      summary: Cancel a payroll run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Cancelled run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayrollRun"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

# ─────────────────────────────────────────────
# Schemas
# ─────────────────────────────────────────────
components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthUser:
      type: object
      required: [id, name, email, role]
      properties:
        id:
          type: number
        name:
          type: string
        email:
          type: string
        role:
          type: string

    CompanySettings:
      type: object
      required: [id, companyName, createdAt, updatedAt]
      properties:
        id:
          type: number
        companyName:
          type: string
        logoPath:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]
        createdAt:
          type: string
        updatedAt:
          type: string

    CompanySettingsUpdate:
      type: object
      properties:
        companyName:
          type: string
        logoPath:
          type: ["string", "null"]
        address:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        website:
          type: ["string", "null"]

    DashboardStats:
      type: object
      required: [totalEmployees, payrollRuns, payslipsGenerated, recentActivity]
      properties:
        totalEmployees:
          type: number
        payrollRuns:
          type: number
        payslipsGenerated:
          type: number
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/AuditLog"

    AuditLog:
      type: object
      required: [id, action, performedAt]
      properties:
        id:
          type: number
        action:
          type: string
        entityType:
          type: ["string", "null"]
        entityId:
          type: ["number", "null"]
        performedBy:
          type: ["number", "null"]
        performedByName:
          type: ["string", "null"]
        details:
          type: ["string", "null"]
        performedAt:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
        objectPath:
          type: string
        metadata:
          type: object
          properties:
            name:
              type: string
            size:
              type: number
            contentType:
              type: string

    # ─── Employees ───────────────────────────────
    Employee:
      type: object
      required: [id, employeeCode, employeeName, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        employeeCode:
          type: string
        employeeName:
          type: string
        mobileNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        branch:
          type: ["string", "null"]
        joiningDate:
          type: ["string", "null"]
        status:
          type: string
          enum: [ACTIVE, INACTIVE]
        createdAt:
          type: string
        updatedAt:
          type: string

    EmployeeListResponse:
      type: object
      required: [employees, total, page, limit]
      properties:
        employees:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        total:
          type: number
        page:
          type: number
        limit:
          type: number

    EmployeeInput:
      type: object
      required: [employeeCode, employeeName]
      properties:
        employeeCode:
          type: string
        employeeName:
          type: string
        mobileNumber:
          type: string
        email:
          type: string
        designation:
          type: string
        branch:
          type: string
        joiningDate:
          type: string
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    EmployeeUpdate:
      type: object
      properties:
        employeeCode:
          type: string
        employeeName:
          type: string
        mobileNumber:
          type: ["string", "null"]
        email:
          type: ["string", "null"]
        designation:
          type: ["string", "null"]
        branch:
          type: ["string", "null"]
        joiningDate:
          type: ["string", "null"]

    EmployeeStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ACTIVE, INACTIVE]

    # ─── Payroll Upload ───────────────────────────
    PayrollUploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
        size:
          type: number
        contentType:
          type: string

    ParseExcelInput:
      type: object
      required: [objectPath]
      properties:
        objectPath:
          type: string
        sheetName:
          type: string

    ParseExcelResult:
      type: object
      required: [sheets, headers, rowCount]
      properties:
        sheets:
          type: array
          items:
            type: string
        selectedSheet:
          type: string
        headers:
          type: array
          items:
            type: string
        rowCount:
          type: number

    ColumnMapping:
      type: object
      properties:
        employeeId:
          type: string
        employeeName:
          type: string
        mobile:
          type: string
        email:
          type: string
        designation:
          type: string
        branch:
          type: string
        joiningDate:
          type: string
        basic:
          type: string
        da:
          type: string
        hra:
          type: string
        otherEarnings:
          type: string
        grossSalary:
          type: string
        pfEmployee:
          type: string
        pfEmployer:
          type: string
        esiEmployee:
          type: string
        esiEmployer:
          type: string
        pt:
          type: string
        otherDeductions:
          type: string
        netSalary:
          type: string

    PayrollValidationInput:
      type: object
      required: [objectPath, sheetName, columnMapping, payrollMonth, payrollYear]
      properties:
        objectPath:
          type: string
        sheetName:
          type: string
        columnMapping:
          $ref: "#/components/schemas/ColumnMapping"
        payrollMonth:
          type: number
          minimum: 1
          maximum: 12
        payrollYear:
          type: number
          minimum: 2000
          maximum: 2100

    PayrollValidationRow:
      type: object
      required: [rowIndex, status, errors, warnings]
      properties:
        rowIndex:
          type: number
        employeeCode:
          type: ["string", "null"]
        employeeName:
          type: ["string", "null"]
        mobileNumber:
          type: ["string", "null"]
        mobileStatus:
          type: string
          enum: [valid, missing, invalid]
        designation:
          type: ["string", "null"]
        branch:
          type: ["string", "null"]
        grossSalary:
          type: ["string", "null"]
        totalDeductions:
          type: ["string", "null"]
        netSalary:
          type: ["string", "null"]
        status:
          type: string
          enum: [valid, warning, error]
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string

    PayrollValidationSummary:
      type: object
      required: [total, valid, withWarnings, withErrors, totalGross, totalDeductions, totalNet, validMobileCount, missingMobileCount, invalidMobileCount]
      properties:
        total:
          type: number
        valid:
          type: number
        withWarnings:
          type: number
        withErrors:
          type: number
        totalGross:
          type: string
        totalDeductions:
          type: string
        totalNet:
          type: string
        validMobileCount:
          type: number
        missingMobileCount:
          type: number
        invalidMobileCount:
          type: number

    PayrollValidationResult:
      type: object
      required: [rows, summary, unmappedColumns, duplicateIds]
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/PayrollValidationRow"
        summary:
          $ref: "#/components/schemas/PayrollValidationSummary"
        unmappedColumns:
          type: array
          items:
            type: string
        duplicateIds:
          type: array
          items:
            type: string
        existingRunWarning:
          type: ["string", "null"]

    PayrollImportInput:
      type: object
      required: [objectPath, fileName, sheetName, columnMapping, payrollMonth, payrollYear]
      properties:
        objectPath:
          type: string
        fileName:
          type: string
        sheetName:
          type: string
        columnMapping:
          $ref: "#/components/schemas/ColumnMapping"
        payrollMonth:
          type: number
          minimum: 1
          maximum: 12
        payrollYear:
          type: number
          minimum: 2000
          maximum: 2100
        confirmedWithWarnings:
          type: boolean

    PayrollImportResult:
      type: object
      required: [payrollRunId, employeeCount, totalGross, totalDeductions, totalNet]
      properties:
        payrollRunId:
          type: number
        employeeCount:
          type: number
        totalGross:
          type: string
        totalDeductions:
          type: string
        totalNet:
          type: string

    ColumnMappingInput:
      type: object
      required: [mapping]
      properties:
        mapping:
          $ref: "#/components/schemas/ColumnMapping"

    ColumnMappingResponse:
      type: object
      required: [mapping]
      properties:
        mapping:
          oneOf:
            - $ref: "#/components/schemas/ColumnMapping"
            - type: "null"

    # ─── Payroll Runs ─────────────────────────────
    PayrollRun:
      type: object
      required: [id, payrollMonth, payrollYear, originalFileName, employeeCount, totalGross, totalDeductions, totalNet, status, createdAt, updatedAt]
      properties:
        id:
          type: number
        payrollMonth:
          type: number
        payrollYear:
          type: number
        originalFileName:
          type: string
        fileStoragePath:
          type: string
        uploadedBy:
          type: ["number", "null"]
        uploadedByName:
          type: ["string", "null"]
        uploadTimestamp:
          type: string
        employeeCount:
          type: number
        totalGross:
          type: string
        totalDeductions:
          type: string
        totalNet:
          type: string
        status:
          type: string
